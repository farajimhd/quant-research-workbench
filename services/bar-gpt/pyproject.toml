[project]
name = "bar-gpt-service"
version = "0.1.0"
description = "Causal multiscale BarGPT v2/v3 production inference service."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "polars",
  "pydantic",
  "pyarrow",
  "torch",
  "uvicorn",
  "websockets",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests"]
