[project]
name = "market-ai"
version = "0.1.0"
description = "Market event batching and ML serving primitives."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "numpy",
  "pydantic",
  "rich",
  "uvicorn",
  "websockets",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
